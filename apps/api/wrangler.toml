name = "oisint-nextgen-api"
main = "src/worker.ts"
compatibility_date = "2026-08-24"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
SUPABASE_URL = "http://127.0.0.1:54321"
SUPABASE_ANON_KEY = ""
CORS_ORIGIN = "http://localhost:8081"

[[durable_objects.bindings]]
name = "EGRESS_REPLAY_GUARD"
class_name = "EgressReplayGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EgressReplayGuard"]
