# XcodeGen 定義（APPLE_NATIVE_PLAN.md §2.2）
# 生成: cd apple && xcodegen generate
# 生成物 OISINT.xcodeproj もコミットする（xcodegen 未導入環境でもビルド可能にするため）
name: OISINT
options:
  createIntermediateGroups: true
  # 開発言語は日本語。英語は String Catalog（OISINTKit/Localizable.xcstrings・App/InfoPlist.xcstrings）で提供する。
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  OISINTKit:
    path: OISINTKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OISINT:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Config/**"
    configFiles:
      Debug: App/Config/Base.xcconfig
      Release: App/Config/Base.xcconfig
    dependencies:
      - package: OISINTKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oisint.nextgen
        PRODUCT_NAME: OISINT
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # 署名資格は外部設定。宣言は既存 pbxproj の Automatic 設定と同期する。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: XBT5U5CHS8
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Simulator でも Supabase の Keychain 保存にはアプリ署名が必要。
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/OISINT-Simulator.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/OISINT-macOS.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    scheme:
      shared: true
      testTargets:
        - OISINTUITests
  OISINTUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: OISINT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oisint.nextgen.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OISINT
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
